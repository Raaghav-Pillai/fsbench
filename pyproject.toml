[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsbench"
version = "0.3.0"
description = "FS-EntropyBench: measure how filesystem structure affects agent task performance"
requires-python = ">=3.10"
dependencies = [
    "fpdf2>=2.7",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
plot = ["matplotlib>=3.8"]

[project.scripts]
fsbench = "fsbench.cli:main"

[tool.setuptools.packages.find]
include = ["fsbench*"]

[tool.setuptools.package-data]
fsbench = ["packs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
